[project]
name = "bettersafethansorry"
version = "0.3.7"
description = "Configurable backup application"
authors = [{ name = "Maarten De Munck", email = "maarten@vijfendertig.be" }]
maintainers = [{ name = "Maarten De Munck", email = "maarten@vijfendertig.be" }]
readme = "README.md"
license = "GPL-3.0-only"
keywords = ["Backup"]
requires-python = ">=3.7,<4.0"
dependencies = [
    "pyyaml (>=6.0,<7.0)",
    "deepmerge (>=1.1.0,<2.0.0)",
    "requests (>=2.28.1,<3.0.0)",
    "exif (>=1.5.0,<2.0.0)",
]

[project.urls]
Repository = "https://gitea.home.vijfendertig.be/maarten/bettersafethansorry"

[project.scripts]
bsts = "bettersafethansorry.cli:main"

[tool.poetry.group.dev.dependencies]
autopep8 = "^2.0.0"
pytest = "^7.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
